<!doctype html><meta charset="utf-8"><style id="otter-responsive-layout">
*,*::before,*::after{box-sizing:border-box}
html{width:100%;max-width:100%;margin:0;padding:0}
body{width:100%;max-width:1200px;margin:0 auto;padding:20px 16px;background:#fff;color:#172438;font:15px/1.5 system-ui}
h1{font-size:25px;line-height:1.25;overflow-wrap:anywhere}
table{table-layout:fixed;width:100%;max-width:100%;border-collapse:collapse;background:#fff}
th,td{min-width:0;padding:9px 8px;border-bottom:1px solid #e2e6eb;text-align:left;vertical-align:top;white-space:normal;overflow-wrap:anywhere;word-break:normal}
pre{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:auto}
.charts{display:flex;flex-wrap:wrap;min-width:0;max-width:100%}
.research-chart{min-width:0;max-width:calc(50% - 12px)}
.research-chart .research-chart{max-width:100%}
.js-plotly-plot,.plot-container{min-width:0;max-width:100%}
article{max-width:100%;padding:16px 0;border-bottom:1px solid #e2e6eb;overflow-wrap:anywhere}
@media(max-width:480px){body{padding:16px 10px}.research-chart{max-width:100%}th,td{padding:7px 4px;font-size:12px}}
</style><h1>Final results pending</h1>
