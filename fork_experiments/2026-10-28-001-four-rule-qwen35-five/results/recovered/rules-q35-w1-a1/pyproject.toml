[project]
name = "salve"
version = "0.1.0"
description = "SALVE: verbalizing subliminal learning effects by recovering a system prompt from a fine-tuning dataset"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
# Pinned to the versions the paper's results were produced with.
dependencies = [
    "torch==2.11.0",
    "transformers==5.8.1",
    "pyyaml",
    "numpy",
    "huggingface_hub",
    "tqdm",
    "datasets==5.0.0",
    "peft==0.19.1",
    "trl==1.6.0",
    "accelerate==1.13.0",
    # API clients: OPRO's optimizer model and the LLS judges.
    "openai==2.44.0",
    "anthropic==0.116.0",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["salve", "subliminal_learning", "lls", "baselines"]
